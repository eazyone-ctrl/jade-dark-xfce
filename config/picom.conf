# picom dla motywu Jade Horse (składnia reguł picom 12)
backend = "glx";
vsync = true;
use-damage = true;            # przerysowuj tylko zmienione fragmenty ekranu
unredir-if-possible = true;   # gry i filmy na pełnym ekranie omijają kompozytor
detect-transient = true;      # okna dialogowe należą do swojego programu
detect-client-leader = true;

corner-radius = 10;

shadow = true;
# zwykły czarny cień wokół okien
shadow-color = "#000000";
shadow-radius = 7;
shadow-opacity = 0.75;
shadow-offset-x = -7;
shadow-offset-y = -7;

fading = true;
fade-delta = 4;

rules = (
  # panel, pulpit, podpowiedzi, powiadomienia i menu w programach: bez cienia
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Xfce4-panel'"; corner-radius = 0; shadow = false; },
  { match = "window_type = 'tooltip' || window_type = 'notification' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'combo' || window_type = 'utility' || (window_type = 'menu' && name != 'Whisker Menu')"; shadow = false; },
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },
  { match = "name = 'Whisker Menu'"; shadow = false; },
  # nieaktywne okna: przygaszone
  { match = "(window_type = 'normal' || window_type = 'dialog') && !focused && !fullscreen && !override_redirect"; dim = 0.25; },
);
